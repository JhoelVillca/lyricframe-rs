<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
            
            .bg { fill: rgb({{ bg_r }}, {{ bg_g }}, {{ bg_b }}); }
            .text-primary { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; fill: rgb({{ fg_r }}, {{ fg_g }}, {{ fg_b }}); }
            .text-secondary { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: rgb({{ fg_r }}, {{ fg_g }}, {{ fg_b }}); opacity: 0.8; }
            
            .eq-bar {
                fill: rgb({{ fg_r }}, {{ fg_g }}, {{ fg_b }});
                transform-origin: bottom;
            }

            {% if is_playing %}
            @keyframes bounce {
                0%, 100% { transform: scaleY(0.2); }
                50% { transform: scaleY(1.0); }
            }
            .eq-bar { animation: bounce 1s infinite ease-in-out; }
            .eq-bar:nth-child(2) { animation-delay: -0.2s; }
            .eq-bar:nth-child(3) { animation-delay: -0.4s; }
            {% else %}
            .eq-bar { transform: scaleY(0.2); }
            {% endif %}
        </style>
        
        <clipPath id="art-clip">
            <rect width="90" height="90" rx="10" />
        </clipPath>
    </defs>

    <rect width="600" height="120" rx="15" class="bg" />

    {% if is_empty %}
    <text x="300" y="65" text-anchor="middle" class="text-primary">Silencio sepulcral</text>
    {% else %}
    <g transform="translate(15, 15)">
        <image href="{{ art_base64 }}" width="90" height="90" clip-path="url(#art-clip)" preserveAspectRatio="xMidYMid slice" />
    </g>

    <text x="120" y="45" class="text-primary">{{ track }}</text>
    <text x="120" y="70" class="text-secondary">{{ artist }}</text>
    <text x="120" y="90" class="text-secondary">{{ album }}</text>

    <!-- Ecualizador (Derecha) -->
    <g transform="translate(560, 50)">
        <rect x="0" y="0" width="6" height="20" class="eq-bar" />
        <rect x="10" y="0" width="6" height="20" class="eq-bar" />
        <rect x="20" y="0" width="6" height="20" class="eq-bar" />
    </g>
    {% endif %}
</svg>
